services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ax/open-webui:0.10.2-fix1-AppleSilicon
    container_name: open-webui
    volumes:
      - open-webui:/app/backend/data
    ports:
      - ${OPEN_WEBUI_PORT-3000}:8080
    environment:
      # 설정은 항상 이 파일의 env가 기준 (DB config 테이블 무시, 관리자 UI 변경은 재시작 시 소멸)
      - 'ENABLE_PERSISTENT_CONFIG=false'
      - 'JWT_EXPIRES_IN=24h'
      - 'WEBUI_SECRET_KEY='
      - 'DISABLE_ADMIN=false'
      - 'CHAT_DELETE_ENABLED=true'
      - 'CHAT_DELETE_DAYS=365'
      - 'ENABLE_PASSWORD_VALIDATION=true'
      - 'PASSWORD_BLACKLIST=kftc,admin'
      - 'ENABLE_IMAGE_CAPTURE=true'
      - 'ENABLE_WEBPAGE_ATTACHMENT=false'
      - 'ENABLE_USER_PERSONAL_INFO=false'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  open-webui: {}
