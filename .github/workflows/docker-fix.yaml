# ─────────────────────────────────────────────────────────────────────────────
# Docker Fix Build — fix 브랜치(예: 0.10.2-fix1) 전용 이미지 빌드/배포
#
# - linux/amd64, linux/arm64 를 각각 네이티브 러너에서 빌드 (QEMU 불필요)
# - 두 아치를 하나의 멀티아치 매니페스트로 병합해 GHCR에 push
#   → ghcr.io/<owner>/open-webui:<branch> (예: 0.10.2-fix1)
# - GitHub Release(v<branch>)를 생성/갱신하고 이미지 정보를 릴리즈 노트에 기재
# - 릴리즈/태그는 GITHUB_TOKEN 으로 생성되므로 docker.yaml 의 v* 태그 트리거를
#   연쇄 실행시키지 않음 (GitHub Actions 재귀 방지 규칙)
# ─────────────────────────────────────────────────────────────────────────────
name: Docker Fix Build

on:
  workflow_dispatch:
  push:
    branches:
      - "*-fix*"

concurrency:
  group: docker-fix-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - arch: linux/amd64
            runner: ubuntu-latest
          - arch: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Prepare environment
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
          platform=${{ matrix.platform.arch }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> ${GITHUB_ENV}

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=git-

      - name: Build Docker image
        uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.FULL_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-fix-${{ env.PLATFORM_PAIR }}-${{ github.ref_name }}
          cache-to: type=registry,ref=${{ env.FULL_IMAGE_NAME }}:cache-fix-${{ env.PLATFORM_PAIR }}-${{ github.ref_name }},mode=max
          sbom: true
          build-args: |
            BUILD_HASH=${{ github.sha }}
            USE_CUDA=false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      digest: ${{ steps.digest.outputs.digest }}

    steps:
      - name: Prepare environment
        run: |
          echo "FULL_IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Download digests
        uses: actions/download-artifact@v5
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FULL_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=git-

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.FULL_IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect image and export digest
        id: digest
        run: |
          docker buildx imagetools inspect "${FULL_IMAGE_NAME}:${{ steps.meta.outputs.version }}"
          digest=$(docker buildx imagetools inspect "${FULL_IMAGE_NAME}:${{ steps.meta.outputs.version }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  release:
    runs-on: ubuntu-latest
    needs: [merge]
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ needs.merge.outputs.version }}
          IMAGE_DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          set -euo pipefail

          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          TAG="v${GITHUB_REF_NAME}"

          # 태그를 항상 현재 빌드 커밋으로 이동 (GITHUB_TOKEN push → 워크플로우 재귀 트리거 없음)
          git tag -f "${TAG}" "${GITHUB_SHA}"
          git push -f origin "${TAG}"

          {
            echo "## Docker 이미지 (multi-arch: linux/amd64, linux/arm64)"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${IMAGE_VERSION}"
            echo '```'
            echo
            echo "서버에서 \`ax/open-webui\` 이름으로 사용하려면:"
            echo
            echo '```'
            echo "docker tag ${IMAGE}:${IMAGE_VERSION} ax/open-webui:${IMAGE_VERSION}"
            echo '```'
            echo
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 이미지 | \`${IMAGE}:${IMAGE_VERSION}\` |"
            echo "| 다이제스트 | \`${IMAGE_DIGEST}\` |"
            echo "| 커밋 | ${GITHUB_SHA} |"
            echo "| 빌드 인자 | \`USE_CUDA=false\` |"
            echo
            echo "_빌드 워크플로우: [run #${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})_"
          } > notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "${TAG}" --notes-file notes.md
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file notes.md
          fi
